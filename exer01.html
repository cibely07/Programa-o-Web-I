<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade de Variáveis</title>
</head>
<body>
    <h1>Atividade: Praticando Variáveis em JavaScript</h1>
    <p>Abra o console do navegador (aperte F12) para ver os resultados.</p>

    <script>
        // 1️⃣ Declare uma variável nome usando const
        const nome = "Cibely";
        console.log("Nome:", nome);

        // 2️⃣ Declare uma variável idade usando let e reatribua um novo valor
        let idade = 18;
        console.log("Idade inicial:", idade);

        idade = 19;
        console.log("Idade atualizada:", idade);

        // 3️⃣ Crie um objeto produto com nome e valor
        const produto = {
            nome: "Celular",
            valor: 1500
        };
        console.log("Produto original:", produto);

        // 4️⃣ Modifique a propriedade 'valor'
        produto.valor = 1300;
        console.log("Produto modificado:", produto);
    </script>
</body>
</html>
